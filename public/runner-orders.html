<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Runner Orders · C.A.R.E</title><meta name="theme-color" content="#07111f">
<style>
:root{--bg:#eef2f7;--card:#fff;--ink:#14233a;--muted:#667085;--line:#d9e1eb;--nav:#07111f;--blue:#2563eb;--red:#d92d20;--orange:#f79009;--green:#079455;--shadow:0 12px 32px rgba(13,31,55,.10)}*{box-sizing:border-box}body{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}button,input{font:inherit}.shell{max-width:1050px;margin:auto;padding:16px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.brand{display:flex;align-items:center;gap:11px}.back{width:42px;height:42px;border:0;border-radius:13px;background:#fff;box-shadow:var(--shadow);font-size:22px}.brand h1{font-size:23px;margin:0}.brand p{margin:3px 0 0;color:var(--muted);font-size:13px}.live{display:flex;align-items:center;gap:7px;font-weight:800;font-size:12px;color:var(--green);background:#d1fadf;padding:8px 10px;border-radius:999px}.dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 5px rgba(7,148,85,.12)}.hero{background:var(--nav);color:#fff;border-radius:21px;padding:18px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:end;gap:14px}.hero small{color:#b7c3d4}.hero strong{display:block;font-size:33px;margin-top:3px}.hero .name{font-weight:900;font-size:17px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}.stat small{color:var(--muted);font-weight:800}.stat strong{display:block;font-size:25px;margin-top:4px}.toolbar{display:flex;gap:8px;overflow:auto;margin-bottom:13px}.tab{border:0;border-radius:12px;padding:10px 13px;background:#dfe6ef;color:#4b5a6f;font-weight:900;white-space:nowrap}.tab.active{background:var(--nav);color:#fff}.orders{display:flex;flex-direction:column;gap:12px}.order{background:#fff;border:1px solid var(--line);border-radius:19px;box-shadow:0 4px 14px rgba(20,35,55,.05);overflow:hidden;position:relative}.order:before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:#98a2b3}.order.urgent:before{background:var(--red)}.order.high:before{background:var(--orange)}.body{padding:16px 16px 14px 20px}.head{display:flex;justify-content:space-between;gap:12px}.room{font-size:27px;font-weight:950}.meta{color:var(--muted);font-size:12px;margin-top:4px}.priority{font-size:11px;font-weight:950;letter-spacing:.06em;padding:7px 10px;border-radius:999px;height:max-content;background:#eef2f6}.priority.urgent{background:#fee4e2;color:#b42318}.priority.high{background:#fef0c7;color:#b54708}.items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin:13px 0}.item{display:flex;justify-content:space-between;gap:8px;background:#f6f8fb;border-radius:10px;padding:9px 10px;font-weight:800;font-size:13px}.notes{border-left:3px solid #cbd5e1;padding-left:9px;color:#475467;font-size:13px;margin:10px 0}.actionbar{display:grid;grid-template-columns:minmax(0,2fr) minmax(110px,1fr);gap:9px;border-top:1px solid var(--line);padding:13px 16px 15px 20px;background:#fbfcfe}.actionbar button{display:block;width:100%;min-height:48px;border:0;border-radius:12px;padding:12px 10px;font-weight:950;cursor:pointer;font-size:14px;line-height:1.15;white-space:normal}.main{background:var(--blue);color:#fff;box-shadow:0 5px 12px rgba(37,99,235,.22)}.history{background:#e9eef5;color:#1d2939;border:1px solid #cfd8e4!important}.complete{background:#d1fadf;color:#05603a}.empty{text-align:center;color:var(--muted);padding:65px 20px;background:#fff;border-radius:18px}.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--nav);color:#fff;padding:13px 17px;border-radius:13px;display:none;z-index:10}.toast.show{display:block}.newflash{animation:flash 1.1s ease 2}@keyframes flash{50%{transform:scale(1.01);box-shadow:0 0 0 4px rgba(37,99,235,.2)}}.bottom-nav{position:fixed;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom) + 10px);z-index:90;max-width:610px;margin:0 auto;padding:8px;background:rgba(255,255,255,.9);backdrop-filter:blur(20px);border:1px solid rgba(217,225,235,.95);border-radius:24px;box-shadow:0 18px 46px rgba(15,23,42,.16);display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.nav-item{text-decoration:none;color:#667085;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:58px;border-radius:17px;font-size:12px;font-weight:950;background:transparent;box-shadow:none;border:none;cursor:pointer;padding:0;margin:0;width:auto}.nav-item.active{color:#fff;background:var(--nav)}.settings-sheet{position:fixed;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom) + 86px);z-index:130;max-width:610px;margin:0 auto;background:rgba(255,255,255,.97);backdrop-filter:blur(22px);border:1px solid rgba(217,225,235,.95);border-radius:26px;padding:16px;box-shadow:0 28px 70px rgba(15,23,42,.24)}.hidden{display:none!important}.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.sheet-head span{display:block;color:#667085;font-size:11px;font-weight:1000;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}.sheet-head strong{display:block;color:#101828;font-size:23px;font-weight:1000;letter-spacing:-.04em}.sheet-close{width:auto;margin:0;padding:10px 13px;border-radius:999px;background:#f8fafc;color:#344054;border:1px solid #d9e1eb;box-shadow:none;font-size:12px;font-weight:1000}.notify-banner{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#eff8ff;border:1px solid #b2ddff;border-radius:16px;padding:12px 14px;margin-bottom:13px}.notify-banner strong{display:block;font-size:14px}.notify-banner small{display:block;color:#475467;margin-top:2px}.notify-banner button{border:0;border-radius:11px;padding:9px 12px;background:#175cd3;color:#fff;font-weight:900;white-space:nowrap}.notify-banner.ok{background:#ecfdf3;border-color:#abefc6}.notify-banner.ok button{background:#067647}.language-switch{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}.language-switch button{border:1px solid #d9e1eb;background:#fff;border-radius:13px;padding:11px;font-weight:900;cursor:pointer}.language-switch button.active{background:var(--nav);color:#fff;border-color:var(--nav)}.settings-option{width:100%;border:1px solid #d9e1eb;background:#f8fafc;color:#101828;box-shadow:none;border-radius:18px;padding:15px;text-align:left;font-size:15px;font-weight:1000;cursor:pointer}.shell{padding-bottom:98px}@media(max-width:620px){.shell{padding:12px 12px 100px}.brand h1{font-size:19px}.brand p{display:none}.hero{padding:16px}.stats{grid-template-columns:repeat(3,1fr)}.stat{padding:11px}.stat strong{font-size:22px}.items{grid-template-columns:1fr}.actionbar{position:relative;bottom:auto;grid-template-columns:1fr}.actionbar button{min-height:52px;font-size:15px}.room{font-size:24px}}
</style>
</head>
<body><main class="shell">
<header class="top"><div class="brand"><button class="back" onclick="location.href='/launch'">‹</button><div><h1 id="pageTitle">🚚 Runner Orders</h1><p id="pageSubtitle">Órdenes de habitaciones en tiempo real</p></div></div><div class="live"><span class="dot"></span>LIVE</div></header>
<section class="hero"><div><small id="activeOrdersLabel">Órdenes activas</small><strong id="heroCount">0</strong></div><div class="name" id="runnerName">Runner</div></section>
<section class="stats"><div class="stat"><small id="newLabel">Nuevas</small><strong id="sNew">0</strong></div><div class="stat"><small id="progressLabel">En curso</small><strong id="sProgress">0</strong></div><div class="stat"><small id="urgentLabel">Urgentes</small><strong id="sUrgent">0</strong></div></section>
<section id="notifyBanner" class="notify-banner"><div><strong id="notificationsLabel">🔔 Notificaciones</strong><small id="notifyStatus">Actívalas para recibir órdenes aunque no estés mirando esta pantalla.</small></div><button id="notifyBtn" type="button" onclick="enableRunnerNotifications()">Activar</button></section><nav class="toolbar" id="tabs"><button class="tab active" data-filter="active">Activas</button><button class="tab" data-filter="new">Nuevas</button><button class="tab" data-filter="in_progress">En progreso</button><button class="tab" data-filter="delivered">Entregadas</button><button class="tab" data-filter="completed">Completadas</button></nav>
<section id="orders" class="orders"><div class="empty">Cargando órdenes…</div></section>
</main><nav class="bottom-nav"><a class="nav-item active" href="/time-clock?from=runner"><span style="font-size:19px">⏱️</span><span id="clockNavLabel">Clock</span></a><button class="nav-item" type="button" onclick="openSettingsMenu()"><span style="font-size:19px">⚙️</span><span id="settingsNavLabel">Ajustes</span></button></nav><section id="settingsSheet" class="settings-sheet hidden"><div class="sheet-head"><div><span id="settingsSmallLabel">Ajustes</span><strong id="runnerAccountLabel">Cuenta del runner</strong></div><button id="closeSettingsBtn" class="sheet-close" type="button" onclick="closeSettingsMenu()">Cerrar</button></div><div class="language-switch"><button id="langEs" type="button" onclick="setLanguage('es')">Español</button><button id="langEn" type="button" onclick="setLanguage('en')">English</button></div><button id="settingsNotifyBtn" class="settings-option" type="button" onclick="enableRunnerNotifications()">🔔 Activar notificaciones</button><div style="height:8px"></div><button id="changeUserBtn" class="settings-option" type="button" onclick="changeUser()">↪ Cambiar usuario</button></section><div id="toast" class="toast"></div><script src="/socket.io/socket.io.js"></script><script>
let currentLanguage=localStorage.getItem('runnerLanguage')||'es';
const translations={
 es:{subtitle:'Órdenes de habitaciones en tiempo real',activeOrders:'Órdenes activas',new:'Nuevas',progress:'En curso',urgent:'Urgentes',notifications:'🔔 Notificaciones',notifyOff:'Actívalas para recibir órdenes aunque no estés mirando esta pantalla.',notifyOn:'Este teléfono recibirá nuevas órdenes.',activate:'Activar',activated:'Activadas',tabs:['Activas','Nuevas','En progreso','Entregadas','Completadas'],settings:'Ajustes',account:'Cuenta del runner',close:'Cerrar',enableNotifications:'🔔 Activar notificaciones',changeUser:'↪ Cambiar usuario',empty:'🎉 No hay órdenes en esta vista.',scheduled:'Programada',history:'Historial',buttons:{new:'ACEPTAR ORDEN',accepted:'COMENZAR ORDEN',in_progress:'MARCAR ENTREGADA',delivered:'COMPLETAR ORDEN'},statuses:{new:'NUEVA',accepted:'ACEPTADA',in_progress:'EN PROGRESO',delivered:'ENTREGADA',completed:'COMPLETADA'},updated:'Orden actualizada',noHistory:'Sin historial'},
 en:{subtitle:'Room orders in real time',activeOrders:'Active orders',new:'New',progress:'In progress',urgent:'Urgent',notifications:'🔔 Notifications',notifyOff:'Enable them to receive orders even when you are not watching this screen.',notifyOn:'This phone will receive new orders.',activate:'Enable',activated:'Enabled',tabs:['Active','New','In progress','Delivered','Completed'],settings:'Settings',account:'Runner account',close:'Close',enableNotifications:'🔔 Enable notifications',changeUser:'↪ Change user',empty:'🎉 No orders in this view.',scheduled:'Scheduled',history:'History',buttons:{new:'ACCEPT ORDER',accepted:'START ORDER',in_progress:'MARK DELIVERED',delivered:'COMPLETE ORDER'},statuses:{new:'NEW',accepted:'ACCEPTED',in_progress:'IN PROGRESS',delivered:'DELIVERED',completed:'COMPLETED'},updated:'Order updated',noHistory:'No history'}
};
function tr(){return translations[currentLanguage]||translations.es}
function setLanguage(lang){currentLanguage=lang;localStorage.setItem('runnerLanguage',lang);applyLanguage();render()}
function applyLanguage(){const t=tr();document.documentElement.lang=currentLanguage;pageSubtitle.textContent=t.subtitle;activeOrdersLabel.textContent=t.activeOrders;newLabel.textContent=t.new;progressLabel.textContent=t.progress;urgentLabel.textContent=t.urgent;notificationsLabel.textContent=t.notifications;clockNavLabel.textContent='Clock';settingsNavLabel.textContent=t.settings;settingsSmallLabel.textContent=t.settings;runnerAccountLabel.textContent=t.account;closeSettingsBtn.textContent=t.close;settingsNotifyBtn.textContent=t.enableNotifications;changeUserBtn.textContent=t.changeUser;document.querySelectorAll('#tabs .tab').forEach((b,i)=>b.textContent=t.tabs[i]);langEs.classList.toggle('active',currentLanguage==='es');langEn.classList.toggle('active',currentLanguage==='en');updateNotificationStatus()}
function urlBase64ToUint8Array(base64String){const padding='='.repeat((4-base64String.length%4)%4);const base64=(base64String+padding).replace(/-/g,'+').replace(/_/g,'/');const raw=atob(base64);return Uint8Array.from([...raw].map(c=>c.charCodeAt(0)))}
async function enableRunnerNotifications(){
  try{
    if(!('serviceWorker' in navigator)||!('PushManager' in window)||!('Notification' in window))throw new Error('Este dispositivo no admite notificaciones web.');
    const permission=await Notification.requestPermission();
    if(permission!=='granted')throw new Error('Permiso de notificaciones no concedido.');
    const registration=await navigator.serviceWorker.register('/firebase-messaging-sw.js');
    await navigator.serviceWorker.ready;
    const cfg=await fetch('/api/push/config').then(async r=>{const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.message||'Push no configurado');return d});
    let subscription=await registration.pushManager.getSubscription();
    if(!subscription)subscription=await registration.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlBase64ToUint8Array(cfg.publicKey)});
    const response=await fetch('/api/push/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({employeeName,employeeRole:localStorage.getItem('employeeRole')||'Runner',subscription,platform:'runner-orders'})});
    const data=await response.json();if(!response.ok||!data.ok)throw new Error(data.message||'No se pudo registrar el teléfono');
    updateNotificationStatus();toast('Notificaciones activadas');closeSettingsMenu();
  }catch(error){toast(error.message);console.error('RUNNER PUSH ERROR:',error)}
}
async function updateNotificationStatus(){
  const banner=document.getElementById('notifyBanner'),status=document.getElementById('notifyStatus'),btn=document.getElementById('notifyBtn');
  let enabled=false;
  try{if(Notification.permission==='granted'&&'serviceWorker' in navigator){const reg=await navigator.serviceWorker.getRegistration('/firebase-messaging-sw.js')||await navigator.serviceWorker.getRegistration();enabled=Boolean(reg&&await reg.pushManager.getSubscription())}}catch{}
  banner.classList.toggle('ok',enabled);const t=tr();status.textContent=enabled?t.notifyOn:t.notifyOff;btn.textContent=enabled?t.activated:t.activate;btn.disabled=enabled;
}
function openSettingsMenu(){document.getElementById('settingsSheet').classList.remove('hidden')}function closeSettingsMenu(){document.getElementById('settingsSheet').classList.add('hidden')}function changeUser(){['employeeCode','employeeName','employeeRole','employeeSessionVerifiedAt','cleanerName'].forEach(k=>localStorage.removeItem(k));window.location.replace('/launch')}document.addEventListener('click',e=>{const sheet=document.getElementById('settingsSheet');if(!sheet||sheet.classList.contains('hidden'))return;if(e.target.closest('#settingsSheet')||e.target.closest('[onclick=\"openSettingsMenu()\"]'))return;closeSettingsMenu()});let allOrders=[],filter='active',lastIds=new Set();const employeeName=(localStorage.getItem('employeeName')||'Runner').trim();document.getElementById('runnerName').textContent=employeeName||'Runner';
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function toast(m){const e=document.getElementById('toast');e.textContent=m;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2400)}
async function api(url,opt){const r=await fetch(url,{headers:{'Content-Type':'application/json'},...opt});const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'Error');return d}
function isMine(o){const a=(o.assigned_to||'').trim().toLowerCase(),n=employeeName.toLowerCase();return !a||a==='runner'||a==='unassigned'||a===n||a.includes('runner')}
function active(o){return !['completed','cancelled'].includes(o.status)}
async function load(silent=false){try{const d=await api('/api/service-orders');const next=d.orders.filter(isMine);if(!silent&&lastIds.size){const fresh=next.filter(o=>!lastIds.has(o.id)&&active(o));if(fresh.length)notify(fresh[0])}allOrders=next;lastIds=new Set(next.map(o=>o.id));render()}catch(e){orders.innerHTML=`<div class="empty">${esc(e.message)}</div>`}}
function notify(o){toast(`Nueva orden · ${o.room}`);try{if(Notification.permission==='granted')new Notification(o.priority==='urgent'?`🚨 Orden urgente · ${o.room}`:`📦 Nueva orden · ${o.room}`,{body:(o.items||[]).slice(0,3).map(i=>`${i.quantity} ${i.name}`).join(' · '),tag:`service-order-${o.id}`});navigator.vibrate&&navigator.vibrate([180,90,180]);const ctx=new(window.AudioContext||window.webkitAudioContext)(),osc=ctx.createOscillator(),gain=ctx.createGain();osc.connect(gain);gain.connect(ctx.destination);osc.frequency.value=880;gain.gain.value=.08;osc.start();osc.stop(ctx.currentTime+.18)}catch(e){}}
function render(){let list=allOrders.slice();if(filter==='active')list=list.filter(active);else list=list.filter(o=>o.status===filter);list.sort((a,b)=>{const p={urgent:0,high:1,normal:2};return (p[a.priority]??3)-(p[b.priority]??3)||new Date(a.created_at)-new Date(b.created_at)});const activeList=allOrders.filter(active);heroCount.textContent=activeList.length;sNew.textContent=allOrders.filter(o=>o.status==='new').length;sProgress.textContent=allOrders.filter(o=>['accepted','in_progress','delivered'].includes(o.status)).length;sUrgent.textContent=activeList.filter(o=>o.priority==='urgent').length;orders.innerHTML=list.length?list.map(card).join(''):`<div class="empty">${tr().empty}</div>`}
function card(o){const t=tr();let next='';if(o.status==='new')next='accepted';else if(o.status==='accepted')next='in_progress';else if(o.status==='in_progress')next='delivered';else if(o.status==='delivered')next='completed';const txt=t.buttons[o.status]||'';const items=(o.items||[]).map(i=>`<div class="item"><span>${esc(i.name)}</span><b>×${i.quantity}</b></div>`).join('');return `<article class="order ${esc(o.priority)}"><div class="body"><div class="head"><div><div class="room">${esc(o.room)}</div><div class="meta">${esc(o.category)} · ${new Date(o.created_at).toLocaleString(currentLanguage==='es'?'es-US':'en-US')}</div></div><span class="priority ${esc(o.priority)}">${esc(o.priority).toUpperCase()}</span></div><div class="meta" style="font-weight:900;margin-top:9px">${t.statuses[o.status]||o.status}</div><div class="items">${items}</div>${o.notes?`<div class="notes">${esc(o.notes)}</div>`:''}${o.scheduled_for?`<div class="meta">⏰ ${t.scheduled}: ${new Date(o.scheduled_for).toLocaleString(currentLanguage==='es'?'es-US':'en-US')}</div>`:''}</div><div class="actionbar">${next?`<button class="main ${next==='completed'?'complete':''}" onclick="advance(${o.id},'${next}')">${txt}</button>`:''}<button class="history" onclick="showHistory(${o.id})">${t.history}</button></div></article>`}
async function advance(id,status){try{await api(`/api/service-orders/${id}/status`,{method:'PATCH',body:JSON.stringify({status,actor:employeeName||'Runner'})});toast(tr().updated);await load(true)}catch(e){toast(e.message)}}async function showHistory(id){try{const d=await api(`/api/service-orders/${id}`);alert(d.events.map(e=>`${new Date(e.created_at).toLocaleString()} · ${e.event_type.toUpperCase()} · ${e.actor||'System'}`).join('\n\n')||tr().noHistory)}catch(e){toast(e.message)}}
tabs.addEventListener('click',e=>{const b=e.target.closest('.tab');if(!b)return;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.filter;render()});const socket=io();socket.on('service-order:created',()=>load(false));socket.on('service-order:updated',()=>load(true));applyLanguage();load(true);
</script></body></html>
