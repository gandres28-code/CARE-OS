<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Catálogo de habitaciones · C.A.R.E</title><link rel="stylesheet" href="/css/care-center.css?v=3"><style>.rooms{display:grid;grid-template-columns:280px 1fr;gap:12px}.room-list{max-height:calc(100vh - 170px);overflow:auto}.room-button{width:100%;border:0;border-bottom:1px solid var(--line);padding:12px;background:none;text-align:left}.room-button.active{background:#f1e8ea}.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px}.gallery img{width:100%;height:130px;object-fit:cover;border-radius:13px}.inventory-row{display:grid;grid-template-columns:1fr 70px 1fr;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}@media(max-width:760px){.rooms{grid-template-columns:1fr}.room-list{max-height:230px}}</style></head><body><main class="center"><header class="top"><div><div class="eyebrow">CARE ROOM BOOK</div><h1>Catálogo de habitaciones</h1><div class="sub">Guía visual, inventario e historial para cada unidad.</div></div><button class="btn" onclick="window.location.href='/rooms-manager'">Administrar unidades</button></header><div class="rooms"><aside class="panel"><input id="search" class="input" style="width:100%" placeholder="Buscar habitación" oninput="renderRooms()"><div id="roomList" class="room-list"></div></aside><section id="detail" class="panel"><div class="empty">Selecciona una habitación.</div></section></div></main><script>
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let rooms=[],selected='';function today(){return new Intl.DateTimeFormat('en-CA',{timeZone:'America/Chicago'}).format(new Date())}async function loadRooms(){const r=await fetch(`/api/admin/rooms?date=${today()}`),d=await r.json();rooms=d.rooms||[];renderRooms()}function renderRooms(){const q=$('search').value.toLowerCase(),unique=[...new Map(rooms.filter(r=>!q||`${r.roomNumber} ${r.building} ${r.roomType}`.toLowerCase().includes(q)).map(r=>[r.normalizedRoom||r.roomNumber,r])).values()];$('roomList').innerHTML=unique.map(r=>`<button class="room-button ${selected===r.roomNumber?'active':''}" onclick="openRoom('${esc(r.roomNumber)}')"><b>${esc(r.roomNumber)}</b><div class="muted">${esc(r.building||'Casas')} · ${esc(r.roomType||'Sin tipo')}</div></button>`).join('')||'<div class="empty">Sin habitaciones.</div>'}
async function openRoom(room){selected=room;renderRooms();$('detail').innerHTML='<div class="empty">Cargando catálogo…</div>';const r=await fetch(`/api/rooms/${encodeURIComponent(room)}/catalog`),d=await r.json();const photos=d.photos||[],items=d.inventory||[],history=d.history||[];$('detail').innerHTML=`<div class="panel-head"><div><h2 style="font-size:24px">${esc(room)}</h2><div class="muted">Guía permanente de la unidad</div></div></div><nav class="tabs"><button class="tab active" onclick="catalogTab('photos',this)">Fotografías</button><button class="tab" onclick="catalogTab('inventory',this)">Inventario</button><button class="tab" onclick="catalogTab('history',this)">Historial</button></nav><div id="photos" class="catalog-view"><form class="form" onsubmit="uploadPhoto(event,'${esc(room)}')"><input id="photo" type="file" accept="image/*" required><input id="caption" class="input" placeholder="Descripción o ubicación"><button class="btn primary">Subir referencia</button></form><div class="gallery" style="margin-top:12px">${photos.map(p=>`<figure><img src="${esc(p.photoUrl)}"><figcaption class="muted">${esc(p.caption)}</figcaption></figure>`).join('')||'<div class="empty">Agrega fotografías de referencia.</div>'}</div></div><div id="inventory" class="catalog-view" style="display:none"><form class="form" onsubmit="addItem(event,'${esc(room)}')"><input id="itemName" class="input" placeholder="Artículo" required><input id="itemQty" class="input" type="number" min="0" value="1"><input id="itemLocation" class="input" placeholder="Ubicación"><button class="btn primary">Agregar al inventario</button></form><div style="margin-top:12px">${items.map(i=>`<div class="inventory-row"><b>${esc(i.itemName)}</b><span>${i.expectedQuantity}</span><span class="muted">${esc(i.location)}</span></div>`).join('')||'<div class="empty">Inventario pendiente.</div>'}</div></div><div id="history" class="catalog-view" style="display:none" class="list">${history.map(h=>`<article class="card"><div class="card-top"><b>${esc(h.action)}</b><span class="muted">${new Date(h.eventTime).toLocaleString()}</span></div><div class="note">${esc(h.employee||'')} ${h.note?'· '+esc(h.note):''}</div></article>`).join('')||'<div class="empty">Sin historial.</div>'}</div>`}
function catalogTab(id,b){document.querySelectorAll('.catalog-view').forEach(x=>x.style.display='none');document.querySelectorAll('#detail .tab').forEach(x=>x.classList.remove('active'));$(id).style.display='block';b.classList.add('active')}async function uploadPhoto(e,room){e.preventDefault();const form=new FormData();form.append('photo',$('photo').files[0]);form.append('caption',$('caption').value);form.append('uploadedBy',localStorage.getItem('employeeName')||'Admin');await fetch(`/api/rooms/${encodeURIComponent(room)}/catalog/photos`,{method:'POST',body:form});openRoom(room)}async function addItem(e,room){e.preventDefault();await fetch(`/api/rooms/${encodeURIComponent(room)}/catalog/inventory`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({itemName:$('itemName').value,expectedQuantity:$('itemQty').value,location:$('itemLocation').value,updatedBy:localStorage.getItem('employeeName')||'Admin'})});openRoom(room)}loadRooms();
</script></body></html>
