<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>C.A.R.E · Employee Center</title>
<style>:root{--navy:#0b1f3a;--bg:#f5f6f7;--line:#dce1e7;--muted:#68717d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#111;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:1250px;margin:auto;padding:24px}.head,.toolbar,.card,.stat,.modalbox{background:#fff;border:1px solid var(--line);border-radius:18px}.head{padding:24px;display:flex;justify-content:space-between;gap:18px;align-items:center}.kicker{font-size:10px;letter-spacing:.15em;font-weight:900;color:#49637f}h1{margin:5px 0;font-size:35px}.head p,.muted{color:var(--muted)}.toolbar{margin-top:14px;padding:12px;display:grid;grid-template-columns:1fr 190px;gap:9px}.toolbar input,.toolbar select,.form input,.form select,.form textarea{width:100%;border:1px solid var(--line);border-radius:11px;padding:12px;background:#fff;color:#111}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}.stat{padding:16px}.stat span{font-size:11px;color:var(--muted);font-weight:800}.stat strong{display:block;font-size:28px;margin-top:5px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:11px}.card{padding:17px}.person{display:flex;gap:11px;align-items:center}.initials{width:44px;height:44px;border-radius:13px;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:900}.person h3{margin:0}.badges,.actions,.modal-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}.badge{padding:6px 9px;border-radius:99px;background:#edf1f5;font-size:11px;font-weight:800}.badge.active{color:#087647;background:#dcfae6}.badge.inactive{color:#b42318;background:#fee4e2}.btn{border:1px solid var(--navy);border-radius:10px;padding:10px 13px;background:#fff;color:var(--navy);font-weight:850;cursor:pointer}.btn.primary{background:var(--navy);color:#fff}.modal{position:fixed;inset:0;background:rgba(10,18,30,.6);display:none;place-items:center;padding:18px;z-index:50}.modal.open{display:grid}.modalbox{width:min(720px,100%);padding:22px;max-height:92vh;overflow:auto}.modal-title{display:flex;justify-content:space-between;align-items:center}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.form label{font-size:12px;font-weight:850}.form label>*{margin-top:6px}.form .full,.form .check{grid-column:1/-1}.form textarea{min-height:90px}.modal-actions{justify-content:flex-end}@media(max-width:700px){.wrap{padding:12px}.head{align-items:flex-start;flex-direction:column}.toolbar,.summary,.form{grid-template-columns:1fr}.form .full,.form .check{grid-column:auto}}</style>
<link rel="stylesheet" href="/css/care-theme.css?v=1"></head><body><main class="wrap">
<section class="head"><div><div class="kicker">C.A.R.E EMPLOYEE CENTER</div><h1>Equipo</h1><p>Empleados, accesos, roles y formas de pago.</p></div><button class="btn primary" onclick="openForm()">Nuevo empleado</button></section>
<section class="toolbar"><input id="search" placeholder="Buscar por nombre o rol"><select id="statusFilter"><option value="all">Todos</option><option value="active">Activos</option><option value="inactive">Inactivos</option></select></section>
<section class="summary"><article class="stat"><span>Total</span><strong id="total">0</strong></article><article class="stat"><span>Activos</span><strong id="activeCount">0</strong></article><article class="stat"><span>Inactivos</span><strong id="inactiveCount">0</strong></article></section><section id="grid" class="grid"></section></main>
<div id="modal" class="modal"><form id="form" class="modalbox"><div class="modal-title"><h2 id="title">Nuevo empleado</h2><button class="btn" type="button" onclick="closeForm()">Cerrar</button></div><input type="hidden" id="id"><div class="form"><label>Nombre completo<input id="name" required></label><label>Nuevo código <small>(obligatorio al crear)</small><input id="code" type="password" inputmode="numeric" autocomplete="new-password"></label><label>Rol<select id="role"><option>Cleaner</option><option>Inspector</option><option>Cleaner / Inspector</option><option>Dispatch / Inspector</option><option>Laundry / Activities / Runner</option><option>Runner</option><option>Manager</option><option>Admin</option></select></label><label>Tipo de pago<select id="payType"><option value="hourly">Por hora</option><option value="unit">Por unidad</option></select></label><label>Tarifa por hora<input id="hourlyRate" type="number" min="0" step=".01"></label><label>Tarifa por unidad<input id="unitRate" type="number" min="0" step=".01"></label><label>Teléfono<input id="phone"></label><label>Correo<input id="email" type="email"></label><label class="full">Ubicaciones<input id="locations" placeholder="Hotel, Chateau, Oficina"></label><label class="full">Notas<textarea id="notes"></textarea></label><label class="check"><input id="active" type="checkbox" checked> Empleado activo</label></div><div class="modal-actions"><button class="btn" type="button" onclick="closeForm()">Cancelar</button><button class="btn primary" type="submit">Guardar empleado</button></div></form></div>
<script src="/js/secure-actions.js?v=care-security-3"></script><script>
const $=id=>document.getElementById(id),esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));let employees=[];
function initials(name){return String(name||"?").split(/\s+/).slice(0,2).map(x=>x[0]).join("").toUpperCase()}
async function api(url,options={}){const r=await CareSecureActions.fetch(url,options),d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.message||`Error ${r.status}`);return d}
async function load(){try{const d=await api(`/api/v2/employees?active=0&t=${Date.now()}`);employees=d.employees||[];render()}catch(error){$("grid").innerHTML=`<article class="card">${esc(error.message)}</article>`}}
function render(){const q=$("search").value.toLowerCase(),f=$("statusFilter").value,rows=employees.filter(e=>(f==="all"||(f==="active")===!!e.active)&&(!q||`${e.name} ${e.role}`.toLowerCase().includes(q)));$("total").textContent=employees.length;$("activeCount").textContent=employees.filter(e=>e.active).length;$("inactiveCount").textContent=employees.filter(e=>!e.active).length;$("grid").innerHTML=rows.map(e=>`<article class="card"><div class="person"><div class="initials">${esc(initials(e.name))}</div><div><h3>${esc(e.name)}</h3><div class="muted">${esc(e.role||"Sin rol")}</div></div></div><div class="badges"><span class="badge">Código ${e.hasCode?"configurado":"pendiente"}</span><span class="badge ${e.active?"active":"inactive"}">${e.active?"Activo":"Inactivo"}</span><span class="badge">${e.payType==="unit"?"Por unidad":"Por hora"}</span></div><div class="actions"><button class="btn primary" onclick="edit(${e.id})">Editar</button><button class="btn" onclick="toggleEmployee(${e.id},${!e.active})">${e.active?"Desactivar":"Activar"}</button></div></article>`).join("")||'<article class="card">No hay empleados en este filtro.</article>'}
function openForm(e={}){$("id").value=e.id||"";$("name").value=e.name||"";$("code").value="";$("role").value=e.role||"Cleaner";$("payType").value=e.payType||"hourly";$("hourlyRate").value=e.hourlyRate||0;$("unitRate").value=e.unitRate||0;$("phone").value=e.phone||"";$("email").value=e.email||"";$("locations").value=(e.workLocations||[]).join(", ");$("notes").value=e.notes||"";$("active").checked=e.active!==false;$("title").textContent=e.id?"Editar empleado":"Nuevo empleado";$("modal").classList.add("open")}
function closeForm(){$("modal").classList.remove("open")}function edit(id){openForm(employees.find(x=>Number(x.id)===Number(id)))}
async function toggleEmployee(id,active){try{await api(`/api/v2/employees/${id}/status`,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({active})});await load()}catch(error){alert(error.message)}}
$("form").onsubmit=async event=>{event.preventDefault();const id=$("id").value,body={name:$("name").value,code:$("code").value,role:$("role").value,payType:$("payType").value,hourlyRate:$("hourlyRate").value,unitRate:$("unitRate").value,phone:$("phone").value,email:$("email").value,workLocations:$("locations").value.split(",").map(x=>x.trim()).filter(Boolean),notes:$("notes").value,active:$("active").checked};if(!id&&!body.code)return alert("El código es obligatorio para un empleado nuevo.");try{await api(id?`/api/v2/employees/${id}`:"/api/v2/employees",{method:id?"PUT":"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});closeForm();await load()}catch(error){alert(error.message)}};
$("search").oninput=render;$("statusFilter").onchange=render;load();
</script><script src="/js/care-theme.js?v=1"></script></body></html>
