<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Operaciones · Care OS</title><link rel="stylesheet" href="/css/care-center.css?v=3"></head><body><main class="center"><header class="top"><div><div class="eyebrow">CARE OPERATIONS</div><h1>Centro de operaciones</h1><div class="sub">Órdenes, actividad y decisiones de IA en una sola pantalla.</div></div><div class="actions"><input id="date" class="input" type="date"><button class="btn primary" onclick="loadAll(true)">Actualizar</button></div></header>
<section class="metrics"><article class="metric"><span>Órdenes abiertas</span><strong id="openCount">0</strong></article><article class="metric"><span>Urgentes</span><strong id="urgentCount">0</strong></article><article class="metric"><span>Actividad hoy</span><strong id="eventCount">0</strong></article><article class="metric"><span>Reportes</span><strong id="reportCount">0</strong></article></section>
<nav class="tabs"><button class="tab active" onclick="tab('orders',this)">Service Orders</button><button class="tab" onclick="tab('feed',this)">Operations Feed</button><button class="tab" onclick="tab('reports',this)">Reportes</button><button class="tab" onclick="tab('ai',this)">IA Operations</button></nav>
<section id="orders" class="view active"><div class="panel"><div class="panel-head"><h2>Órdenes activas</h2><div class="filters"><input id="orderSearch" class="input" placeholder="Unidad o artículo" oninput="renderOrders()"><select id="orderStatus" class="input" onchange="renderOrders()"><option value="">Todos</option><option value="new">Nuevas</option><option value="accepted">Aceptadas</option><option value="in_progress">En progreso</option><option value="delivered">Entregadas</option></select></div></div><div id="ordersList" class="list"></div></div></section>
<section id="feed" class="view"><div class="panel"><div class="panel-head"><h2>Actividad en vivo</h2><input id="feedSearch" class="input" placeholder="Filtrar unidad, persona o acción" oninput="renderFeed()"></div><div id="feedList" class="list"></div></div></section>
<section id="reports" class="view"><div class="panel"><div class="panel-head"><h2>Reportes de cleaners e inspectores</h2><input id="reportSearch" class="input" placeholder="Filtrar reportes" oninput="renderReports()"></div><div id="reportList" class="list"></div></div></section>
<section id="ai" class="view"><div class="grid2"><article class="panel"><h2>Resumen operativo</h2><div id="aiSummary" class="note">Analizando…</div></article><article class="panel"><h2>Acciones recomendadas</h2><div id="aiList" class="list"></div></article></div></section></main><script src="/socket.io/socket.io.js"></script><script>
const $=id=>document.getElementById(id);let orders=[],events=[],reports=[],director={};const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function today(){return new Intl.DateTimeFormat('en-CA',{timeZone:'America/Chicago'}).format(new Date())}function tab(id,b){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');b.classList.add('active')}function items(o){return(o.items||[]).map(x=>`${x.quantity} ${x.name}`).join(' · ')}
function renderOrders(){const q=$('orderSearch').value.toLowerCase(),s=$('orderStatus').value;const rows=orders.filter(o=>(!s||o.status===s)&&(!q||`${o.room} ${items(o)} ${o.requested_by||o.requestedBy}`.toLowerCase().includes(q)));$('ordersList').innerHTML=rows.map(o=>`<article class="card"><div class="card-top"><div><span class="room">${esc(o.room)}</span> <span class="chip ${esc(o.priority)}">${esc(o.priority)}</span></div><span class="chip">${esc(o.status)}</span></div><div class="note"><b>${esc(items(o)||o.category)}</b><br>${esc(o.notes||'')}</div><div class="muted">${esc(o.requested_by||o.requestedBy||'')} · ${new Date(o.created_at||o.createdAt).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}</div></article>`).join('')||'<div class="empty">No hay órdenes en este filtro.</div>'}
function renderFeed(){const q=$('feedSearch').value.toLowerCase(),rows=events.filter(e=>!q||`${e.unit} ${e.employee} ${e.action} ${e.note}`.toLowerCase().includes(q));$('feedList').innerHTML=rows.map(e=>`<article class="card"><div class="card-top"><div><span class="room">${esc(e.unit||'—')}</span> <span class="chip">${esc(e.action)}</span></div><span class="muted">${esc(e.time||'')}</span></div><div class="note">${esc(e.employee||e.person||'Operación')} ${e.note?`· ${esc(e.note)}`:''}</div></article>`).join('')||'<div class="empty">Sin actividad.</div>'}
function renderReports(){const q=$('reportSearch').value.toLowerCase(),rows=reports.filter(r=>!q||`${r.unit} ${r.employee||r.person} ${r.action} ${r.note||r.message}`.toLowerCase().includes(q));$('reportList').innerHTML=rows.map(r=>`<article class="card"><div class="card-top"><div><span class="room">${esc(r.unit||'—')}</span> <span class="chip ${String(r.priority||'').toLowerCase()}">${esc(r.action||r.category||'Reporte')}</span></div><span class="muted">${esc(r.time||'')}</span></div><div class="note"><b>${esc(r.employee||r.person||'')}</b> · ${esc(r.note||r.message||'Sin nota')}</div></article>`).join('')||'<div class="empty">No hay reportes.</div>'}
function renderAI(){const recs=director.recommendations||[];$('aiSummary').textContent=director.summary||'No hay resumen disponible.';$('aiList').innerHTML=recs.map(x=>`<article class="card"><span class="chip ${esc(x.priority)}">${esc(x.priority)}</span><div class="note"><b>${esc(x.title)}</b><br>${esc(x.message)}</div><div class="muted">→ ${esc(x.action)}</div></article>`).join('')||'<div class="empty">No hay acciones importantes.</div>'}
async function loadAll(fresh=false){const d=$('date').value;try{const [a,b,c,e]=await Promise.all([fetch('/api/service-orders?status=all'),fetch(`/api/v2/operations?date=${d}&limit=300`),fetch(`/operations-reports?date=${d}`),fetch(`/api/ai-director?date=${d}${fresh?'&fresh=true':''}`)]);const [ad,bd,cd,ed]=await Promise.all([a.json(),b.json(),c.json(),e.json()]);orders=ad.orders||[];events=bd.events||[];reports=cd.reports||[];director=ed||{};$('openCount').textContent=orders.filter(x=>!['completed','cancelled'].includes(x.status)).length;$('urgentCount').textContent=orders.filter(x=>x.priority==='urgent'&&!['completed','cancelled'].includes(x.status)).length;$('eventCount').textContent=events.length;$('reportCount').textContent=reports.length;renderOrders();renderFeed();renderReports();renderAI()}catch(err){console.error(err)}}$('date').value=today();loadAll();if(typeof io==='function'){const s=io();['service-order:created','service-order:updated','operations-log-created','ai-director-updated'].forEach(n=>s.on(n,()=>loadAll(false)))}
</script></body></html>
