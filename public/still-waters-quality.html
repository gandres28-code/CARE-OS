<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Still Waters Quality Game</title>
<style>
:root{--bg:#07111f;--panel:#0d1b2d;--panel2:#12243a;--line:#263c55;--text:#f5f8fc;--muted:#91a4b9;--blue:#4ea7ff;--green:#35d07f;--amber:#ffbd4a;--red:#ff6470}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#17304c 0,transparent 35%),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,sans-serif}.app{max-width:1500px;margin:auto;padding:18px}.top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px}.brand h1{margin:0;font-size:23px}.brand p{margin:4px 0 0;color:var(--muted)}button,input,textarea{font:inherit}.login,.panel{background:rgba(13,27,45,.95);border:1px solid var(--line);border-radius:22px}.login{max-width:430px;margin:12vh auto;padding:28px}.login h2{margin-top:0}.field{width:100%;background:#081524;color:white;border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}.primary{border:0;background:var(--blue);color:#06111d;padding:13px 18px;border-radius:14px;font-weight:800;cursor:pointer}.ghost{border:1px solid var(--line);background:transparent;color:var(--text);padding:11px 15px;border-radius:13px;cursor:pointer}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}.metric{padding:16px;background:var(--panel);border:1px solid var(--line);border-radius:17px}.metric span{color:var(--muted);font-size:13px}.metric b{display:block;font-size:26px;margin-top:5px}.building{margin-bottom:16px}.building-head{display:flex;align-items:center;gap:10px;margin:0 0 9px}.letter{width:36px;height:36px;border-radius:11px;background:var(--blue);color:#07111f;display:grid;place-items:center;font-weight:900}.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:9px}.room{min-height:78px;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:15px;padding:10px;text-align:left;cursor:pointer}.room b{display:block;font-size:16px}.room small{color:var(--muted)}.room.pending{border-color:#6b7b8f}.room.progress{border-color:var(--amber)}.room.approved{border-color:var(--green);background:rgba(53,208,127,.09)}.room.correction{border-color:var(--red);background:rgba(255,100,112,.09)}.overlay{position:fixed;inset:0;background:rgba(2,8,15,.78);display:none;align-items:flex-start;justify-content:center;padding:22px;overflow:auto;z-index:20}.overlay.show{display:flex}.game{width:min(900px,100%);background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:20px;margin:auto}.game-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.game-head h2{margin:0}.sub{color:var(--muted);margin-top:5px}.progress-track{height:10px;background:#081524;border-radius:99px;overflow:hidden;margin:17px 0}.progress-fill{height:100%;background:var(--blue);width:0;transition:.3s}.areas{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.area{border:1px solid var(--line);background:var(--panel2);border-radius:18px;padding:15px}.area-title{display:flex;justify-content:space-between;gap:8px;align-items:center}.area-title strong{font-size:16px}.stars{display:flex;gap:5px;margin-top:12px}.star{border:0;background:transparent;color:#53677d;font-size:28px;padding:2px;cursor:pointer}.star.on{color:#ffd25e}.issues{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.chip{border:1px solid var(--line);background:#0a1726;color:var(--muted);border-radius:999px;padding:7px 10px;font-size:12px;cursor:pointer}.chip.on{border-color:var(--red);color:#ffd7da;background:rgba(255,100,112,.12)}.result{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;background:#081524;border-radius:17px;padding:16px;margin-top:15px}.score{font-size:32px;font-weight:900}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:15px}.approve{background:var(--green)}.correct{background:var(--red);color:white}.message{color:var(--muted);min-height:22px;margin-top:9px}@media(max-width:720px){.metrics{grid-template-columns:1fr 1fr}.areas{grid-template-columns:1fr}.app{padding:11px}.overlay{padding:8px}.game{border-radius:18px;padding:14px}.rooms{grid-template-columns:repeat(3,1fr)}}
</style>
<link rel="stylesheet" href="/css/responsive-pages.css?v=full-page-v1">
</head>
<body>
<div id="login" class="login"><h2>🎮 Still Waters Quality</h2><p>Ingresa tu código de inspector para comenzar.</p><input id="code" class="field" inputmode="numeric" placeholder="Código de empleado"><button id="loginBtn" class="primary" type="button">Entrar al juego</button><div id="loginMsg" class="message"></div></div>
<main id="app" class="app" hidden><header class="top"><div class="brand"><h1>Still Waters Quality Game</h1><p id="welcome">Mapa de inspecciones</p></div><button id="logout" class="ghost">Salir</button></header><section class="metrics"><div class="metric"><span>Unidades</span><b id="mTotal">0</b></div><div class="metric"><span>Por evaluar</span><b id="mPending">0</b></div><div class="metric"><span>Aprobadas</span><b id="mApproved">0</b></div><div class="metric"><span>Promedio</span><b id="mAverage">0%</b></div></section><div id="map"></div></main>
<div id="overlay" class="overlay"><section class="game"><div class="game-head"><div><h2 id="gameUnit">Unidad</h2><div id="gameMeta" class="sub"></div></div><button id="close" class="ghost">✕</button></div><div class="progress-track"><div id="progress" class="progress-fill"></div></div><div id="areas" class="areas"></div><label class="sub" for="notes">Notas generales</label><textarea id="notes" class="field" rows="3" placeholder="Describe correcciones o detalles importantes"></textarea><div class="result"><div><div class="sub">Puntaje actual</div><div id="score" class="score">0/100</div><div id="rank" class="sub">Completa las áreas</div></div><div id="badge">🎯</div></div><div class="actions"><button id="save" class="primary">Guardar progreso</button><button id="approve" class="primary approve">Aprobar para huésped</button><button id="correction" class="primary correct">Enviar a corrección</button></div><div id="gameMsg" class="message"></div></section></div>
<script src="/socket.io/socket.io.js"></script>
<script>
const AREAS=[
 {id:'bathrooms',icon:'🚿',name:'Baños',issues:['Cabello','Inodoro','Regadera','Espejo','Piso','Olor']},
 {id:'beds',icon:'🛏️',name:'Camas',issues:['Sábanas','Cabello','Arrugas','Debajo de cama','Almohadas']},
 {id:'carpets',icon:'🧹',name:'Alfombras y pisos',issues:['No aspirada','Manchas','Esquinas','Basura','Debajo de muebles']},
 {id:'kitchen',icon:'🍳',name:'Cocina',issues:['Grasa','Refrigerador','Microondas','Platos','Encimeras','Piso']},
 {id:'living',icon:'🛋️',name:'Sala y muebles',issues:['Polvo','Muebles','Ventanas','Basura','Decoración']},
 {id:'amenities',icon:'📦',name:'Amenidades',issues:['Faltantes','Toallas','Papel','Café','Jabón']},
 {id:'presentation',icon:'✨',name:'Presentación',issues:['Olor','Temperatura','Luces','Cortinas','Puerta']}
];
const state={inspector:'',units:[],unit:null,scores:{},issues:[]};
const $=id=>document.getElementById(id); const safe=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function normalize(v){return String(v||'').trim().toUpperCase()}
function building(v){return normalize(v||'OTHER')}
function qClass(u){if(u.quality_status==='approved')return'approved';if(u.quality_status==='correction_required')return'correction';if(u.quality_status==='in_progress')return'progress';return'pending'}
async function login(){const code=$('code').value.trim();$('loginMsg').textContent='Verificando...';try{const r=await fetch('/mobile-code-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code})});const d=await r.json();if(!d.ok)throw new Error(d.message);if(!/inspect|dispatch|admin|manager|operation|supervisor/i.test(d.role||''))throw new Error('Este código no tiene acceso de inspector');state.inspector=d.employee;localStorage.setItem('swQualityInspector',d.employee);showApp();}catch(e){$('loginMsg').textContent=e.message}}
function showApp(){$('login').hidden=true;$('app').hidden=false;$('welcome').textContent=`Inspector: ${state.inspector}`;loadRooms()}
async function loadRooms(){const r=await fetch('/api/quality/rooms?t='+Date.now());const d=await r.json();if(!d.ok)throw new Error(d.message);state.units=d.units||[];renderMap()}
function renderMap(){const groups={};state.units.forEach(u=>(groups[building(u.building)]??=[]).push(u));$('map').innerHTML=Object.keys(groups).sort().map(k=>`<section class="building"><div class="building-head"><div class="letter">${safe(k==='OTHER'?'⌂':k)}</div><div><b>Edificio ${safe(k)}</b><div class="sub">${groups[k].length} unidades</div></div></div><div class="rooms">${groups[k].map(u=>`<button class="room ${qClass(u)}" data-id="${u.id}"><b>${safe(u.unit)}</b><small>${u.overall_score?u.overall_score+'%':u.cleaner||'Sin cleaner'}</small></button>`).join('')}</div></section>`).join('');document.querySelectorAll('.room').forEach(b=>b.addEventListener('click',()=>openGame(b.dataset.id)));const approved=state.units.filter(u=>u.quality_status==='approved').length;const scored=state.units.filter(u=>Number(u.overall_score)>0);$('mTotal').textContent=state.units.length;$('mPending').textContent=state.units.length-approved;$('mApproved').textContent=approved;$('mAverage').textContent=(scored.length?Math.round(scored.reduce((s,u)=>s+Number(u.overall_score),0)/scored.length):0)+'%'}
function openGame(id){state.unit=state.units.find(u=>String(u.id)===String(id));state.scores={...(state.unit.scores||{})};state.issues=Array.isArray(state.unit.issues)?[...state.unit.issues]:[];$('notes').value=state.unit.notes||'';$('gameUnit').textContent=state.unit.unit;$('gameMeta').textContent=`Cleaner: ${state.unit.cleaner||'Sin asignar'} · Inspector: ${state.inspector}`;renderAreas();$('overlay').classList.add('show')}
function renderAreas(){$('areas').innerHTML=AREAS.map(a=>{const score=Number(state.scores[a.id]||0);return `<article class="area"><div class="area-title"><strong>${a.icon} ${a.name}</strong><span>${score?score+'/5':'Pendiente'}</span></div><div class="stars" data-area="${a.id}">${[1,2,3,4,5].map(n=>`<button class="star ${n<=score?'on':''}" data-score="${n}" aria-label="${n} estrellas">★</button>`).join('')}</div><div class="issues">${a.issues.map(i=>{const key=a.id+':'+i;return `<button class="chip ${state.issues.includes(key)?'on':''}" data-issue="${safe(key)}">${safe(i)}</button>`}).join('')}</div></article>`}).join('');document.querySelectorAll('.stars').forEach(row=>row.querySelectorAll('.star').forEach(star=>star.addEventListener('click',()=>{state.scores[row.dataset.area]=Number(star.dataset.score);renderAreas()})));document.querySelectorAll('.chip').forEach(c=>c.addEventListener('click',()=>{const i=state.issues.indexOf(c.dataset.issue);i>=0?state.issues.splice(i,1):state.issues.push(c.dataset.issue);renderAreas()}));updateScore()}
function updateScore(){const vals=AREAS.map(a=>Number(state.scores[a.id]||0)).filter(Boolean);const score=vals.length?Math.round(vals.reduce((a,b)=>a+b,0)/(vals.length*5)*100):0;$('score').textContent=score+'/100';$('progress').style.width=Math.round(vals.length/AREAS.length*100)+'%';let rank='Completa las áreas',badge='🎯';if(vals.length===AREAS.length){if(score>=95){rank='Perfect Room';badge='🏆'}else if(score>=90){rank='Excelente';badge='✨'}else if(score>=80){rank='Aprobada';badge='👍'}else if(score>=70){rank='Requiere correcciones';badge='⚠️'}else{rank='Reprobada';badge='🚨'}}$('rank').textContent=rank;$('badge').textContent=badge}
async function saveReview(status){if(!state.unit)return;const complete=AREAS.every(a=>Number(state.scores[a.id])>0);if(status!=='in_progress'&&!complete){$('gameMsg').textContent='Califica todas las áreas antes de finalizar.';return}if(status==='approved'&&state.issues.length){$('gameMsg').textContent='Hay problemas marcados. Elimínalos o envía la unidad a corrección.';return}$('gameMsg').textContent='Guardando...';try{const r=await fetch('/api/quality/reviews',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({unit:state.unit.unit,cleaner:state.unit.cleaner,inspector:state.inspector,scores:state.scores,issues:state.issues,notes:$('notes').value,status})});const d=await r.json();if(!d.ok)throw new Error(d.message);$('gameMsg').textContent=status==='approved'?'🏆 Habitación aprobada':status==='correction_required'?'Corrección enviada':'Progreso guardado';await loadRooms();if(status!=='in_progress')setTimeout(()=>$('overlay').classList.remove('show'),650)}catch(e){$('gameMsg').textContent=e.message}}
$('loginBtn').addEventListener('click',login);$('code').addEventListener('keydown',e=>{if(e.key==='Enter')login()});$('close').addEventListener('click',()=>$('overlay').classList.remove('show'));$('save').addEventListener('click',()=>saveReview('in_progress'));$('approve').addEventListener('click',()=>saveReview('approved'));$('correction').addEventListener('click',()=>saveReview('correction_required'));$('logout').addEventListener('click',()=>{localStorage.removeItem('swQualityInspector');location.reload()});
const saved=localStorage.getItem('swQualityInspector');if(saved){state.inspector=saved;showApp()}if(typeof io==='function'){const socket=io();socket.on('quality:updated',loadRooms);socket.on('rooms-updated',loadRooms)}
</script>
</body></html>
