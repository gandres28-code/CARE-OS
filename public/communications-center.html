<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Comunicaciones · Care OS</title><link rel="stylesheet" href="/css/care-center.css?v=3"></head><body><main class="center"><header class="top"><div><div class="eyebrow">CARE TEAM</div><h1>Comunicaciones</h1><div class="sub">Notificaciones, chat interno y anuncios del equipo.</div></div><div class="actions"><button class="btn primary" onclick="load()">Actualizar</button></div></header><nav class="tabs"><button class="tab active" onclick="tab('chat',this)">Chat interno</button><button class="tab" onclick="tab('announcements',this)">Anuncios</button><button class="tab" onclick="tab('notifications',this)">Notificaciones</button></nav>
<section id="chat" class="view active"><div class="panel"><div id="chatList" class="chat"></div><form class="send" onsubmit="sendMessage(event)"><input id="message" placeholder="Escribe un mensaje al equipo" maxlength="2000" required><button class="btn primary">Enviar</button></form></div></section>
<section id="announcements" class="view"><div class="grid2"><article class="panel"><h2>Publicar anuncio</h2><form class="form" onsubmit="publishAnnouncement(event)"><input id="announcementTitle" class="input" placeholder="Título" required><textarea id="announcementBody" placeholder="Mensaje para el equipo" required></textarea><select id="announcementPriority" class="input"><option value="normal">Normal</option><option value="important">Importante</option><option value="urgent">Urgente</option></select><button class="btn primary">Publicar</button></form></article><article class="panel"><h2>Anuncios activos</h2><div id="announcementList" class="list"></div></article></div></section>
<section id="notifications" class="view"><iframe class="embedded" src="/notifications" title="Notificaciones"></iframe></section></main><script src="/socket.io/socket.io.js"></script><script>
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let data={messages:[],announcements:[]};function user(){return{name:localStorage.getItem('employeeName')||window.parent?.OS?.user?.name||'Care Team',role:localStorage.getItem('employeeRole')||''}}function tab(id,b){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');b.classList.add('active')}
function render(){const me=user().name;$('chatList').innerHTML=(data.messages||[]).map(m=>`<div class="bubble ${m.sender===me?'mine':''}"><small>${esc(m.sender)} · ${new Date(m.createdAt).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}</small>${esc(m.message)}</div>`).join('')||'<div class="empty">Todavía no hay mensajes.</div>';$('chatList').scrollTop=$('chatList').scrollHeight;$('announcementList').innerHTML=(data.announcements||[]).map(a=>`<article class="card announcement ${esc(a.priority)}"><div class="card-top"><b>${esc(a.title)}</b><span class="chip ${esc(a.priority)}">${esc(a.priority)}</span></div><div class="note">${esc(a.body)}</div><div class="muted">${esc(a.author||'Care OS')}</div></article>`).join('')||'<div class="empty">No hay anuncios activos.</div>'}
async function load(){const r=await fetch('/api/communications');data=await r.json();render()}async function sendMessage(e){e.preventDefault();const u=user(),message=$('message').value.trim();if(!message)return;await fetch('/api/communications/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sender:u.name,senderRole:u.role,message})});$('message').value='';load()}async function publishAnnouncement(e){e.preventDefault();const u=user();await fetch('/api/communications/announcements',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:$('announcementTitle').value,body:$('announcementBody').value,priority:$('announcementPriority').value,author:u.name})});e.target.reset();load()}load();if(typeof io==='function'){const s=io();['communications:message','communications:announcement','communications:updated'].forEach(n=>s.on(n,load))}
</script></body></html>
