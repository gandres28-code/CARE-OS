<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rendimiento · C.A.R.E</title><link rel="stylesheet" href="/css/care-center.css?v=3"><link rel="stylesheet" href="/css/care-theme.css?v=1"></head><body><main class="center"><header class="top"><div><div class="eyebrow">CARE ANALYTICS</div><h1>Rendimiento y calidad</h1><div class="sub">Daily report, estadísticas, inteligencia y calidad en un solo centro.</div></div><button class="btn primary" onclick="downloadDaily()">Descargar Daily Report</button></header><nav class="tabs"><button class="tab active" data-url="/statistics" onclick="openView(this)">Estadísticas</button><button class="tab" data-url="/operations-intelligence" onclick="openView(this)">Operations Intelligence</button><button class="tab" data-url="/quality-performance" onclick="openView(this)">Quality & Performance</button><button class="tab" data-url="/still-waters-quality" onclick="openView(this)">Quality Review</button></nav><iframe id="view" class="embedded" title="Care Analytics" src="/statistics"></iframe></main><script>function openView(button){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));button.classList.add('active');document.getElementById('view').src=button.dataset.url}function downloadDaily(){const date=new Intl.DateTimeFormat('en-CA',{timeZone:'America/Chicago'}).format(new Date());window.location.href=`/finalizar-dia?date=${date}`}</script><script src="/js/care-theme.js?v=1"></script></body></html>
