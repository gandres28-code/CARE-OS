<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f4f7fb"><title>C.A.R.E · Operación en vivo</title><link rel="stylesheet" href="/css/care-theme.css?v=1"><style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.live-shell{padding:16px}.head{display:flex;justify-content:space-between;gap:14px;align-items:center;margin-bottom:13px}.head h1{font-size:20px;margin:0}.head p{font-size:12px;color:var(--care-muted);margin:5px 0 0}.status{display:flex;align-items:center;gap:8px;color:var(--care-muted);font-size:11px;font-weight:800}.status i{width:8px;height:8px;border-radius:50%;background:#98a2b3}.status.on i{background:#16a36a}.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}.metric{padding:13px;border:1px solid var(--care-line);border-radius:14px}.metric span{font-size:9px;text-transform:uppercase;letter-spacing:.09em;color:var(--care-muted);font-weight:900}.metric strong{display:block;font-size:26px;margin-top:7px}.layout{display:grid;grid-template-columns:1.35fr .65fr;gap:10px;margin-top:10px}.panel{border:1px solid var(--care-line);border-radius:15px;padding:13px}.panel h2{font-size:13px;margin:0 0 10px}.buildings{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.building{padding:10px;border:1px solid var(--care-line);border-radius:12px;background:var(--care-surface-2)}.building b{font-size:12px}.building span{float:right;color:var(--care-muted);font-size:10px}.bar{height:5px;background:var(--care-line);border-radius:99px;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--care-navy)}.feed{display:grid;gap:7px;max-height:300px;overflow:auto}.event{padding:9px;border-left:3px solid var(--care-blue);background:var(--care-surface-2);border-radius:8px;font-size:11px}.event b{display:block;margin-bottom:3px}.empty{padding:24px;text-align:center;color:var(--care-muted);font-size:12px}.error{color:#b42318;font-weight:700;font-size:12px}@media(max-width:800px){.metrics{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}.buildings{grid-template-columns:1fr 1fr}}
</style></head><body><main class="live-shell"><header class="head"><div><h1>Operación en vivo</h1><p>Datos actuales de C.A.R.E · PostgreSQL y eventos en tiempo real</p></div><div id="status" class="status"><i></i><span>Conectando</span></div></header><section class="metrics"><article class="metric"><span>Unidades</span><strong id="total">0</strong></article><article class="metric"><span>Ready</span><strong id="ready">0</strong></article><article class="metric"><span>Limpiando</span><strong id="cleaning">0</strong></article><article class="metric"><span>Inspección</span><strong id="inspection">0</strong></article><article class="metric"><span>Alertas</span><strong id="alerts">0</strong></article></section><section class="layout"><div class="panel"><h2>Edificios</h2><div id="buildings" class="buildings"></div></div><div class="panel"><h2>Actividad reciente</h2><div id="feed" class="feed"></div></div></section></main><script src="/socket.io/socket.io.js"></script><script src="/js/care-theme.js?v=1"></script><script>
(()=>{const $=id=>document.getElementById(id),esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));let loading=false,timer;
function count(stats,...keys){for(const key of keys)if(Number.isFinite(Number(stats?.[key])))return Number(stats[key]);return 0}
function render(data){const s=data.stats||{};$('total').textContent=count(s,'totalUnits','total')||data.units?.length||0;$('ready').textContent=count(s,'ready');$('cleaning').textContent=count(s,'inProgress','cleaning');$('inspection').textContent=count(s,'awaitingInspection','inspection');$('alerts').textContent=data.alerts?.length||count(s,'urgent','problems');const buildings=Array.isArray(data.buildings)?data.buildings:Object.values(data.buildings||{});$('buildings').innerHTML=buildings.map(b=>{const total=Number(b.total||b.units?.length||0),ready=Number(b.ready||0),pct=total?Math.round(ready*100/total):0;return `<div class="building"><b>${esc(b.name||b.building||b.key||'Other')}</b><span>${ready}/${total}</span><div class="bar"><i style="width:${pct}%"></i></div></div>`}).join('')||'<div class="empty">Sin edificios para hoy.</div>';const events=data.timeline||data.recentReports||[];$('feed').innerHTML=events.slice(0,15).map(e=>`<div class="event"><b>${esc(e.unit||e.title||e.action||'Actividad')}</b>${esc(e.message||e.note||e.description||e.employee||'Actualización registrada')}</div>`).join('')||'<div class="empty">Sin actividad reciente.</div>'}
async function load(fresh=false){if(loading)return;loading=true;try{const [d,t]=await Promise.all([fetch(`/dashboard-data?t=${Date.now()}${fresh?'&refresh=1':''}`,{cache:'no-store'}),fetch(`/api/timeline?t=${Date.now()}`,{cache:'no-store'})]);const data=await d.json(),timeline=await t.json();if(!d.ok||!data.ok)throw new Error(data.message||'No se pudo cargar');data.timeline=timeline.timeline||data.timeline||[];render(data);$('status').classList.add('on');$('status').querySelector('span').textContent='En vivo'}catch(e){$('feed').innerHTML=`<div class="error">${esc(e.message)}</div>`;$('status').classList.remove('on');$('status').querySelector('span').textContent='Reconectando'}finally{loading=false}}
function refresh(){clearTimeout(timer);timer=setTimeout(()=>load(false),250)}load(true);setInterval(()=>load(false),15000);if(typeof io==='function'){const socket=io();socket.on('connect',()=>{$('status').classList.add('on');$('status').querySelector('span').textContent='En vivo'});socket.on('disconnect',()=>{$('status').classList.remove('on');$('status').querySelector('span').textContent='Reconectando'});['ops-update','rooms:updated','room:updated','dashboard:updated','operations:updated','data:updated'].forEach(n=>socket.on(n,refresh))}})();
</script></body></html>
