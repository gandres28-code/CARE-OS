<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>C.A.R.E · Employee Center</title><style>
:root{--black:#111;--wine:#0b1f3a;--paper:#f6f6f4;--white:#fff;--line:#dededb;--muted:#727272}*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--paper);margin:0;color:var(--black)}.wrap{max-width:1450px;margin:auto;padding:24px}.head{background:#111;color:white;border-radius:24px;padding:25px 28px;display:flex;justify-content:space-between;gap:15px;align-items:center}.kicker{font-size:10px;letter-spacing:.18em;font-weight:900;color:#9fb9d8}.head h1{font:700 34px Georgia,serif;margin:7px 0}.head p{margin:0;color:#bbb}.btn{border:1px solid #ccc;border-radius:11px;padding:11px 15px;font-weight:850;cursor:pointer;background:white;color:#111}.primary{background:var(--wine);border-color:var(--wine);color:white}.toolbar{display:grid;grid-template-columns:1fr 220px;gap:10px;margin:16px 0}.toolbar input,.toolbar select{height:46px;border:1px solid var(--line);border-radius:12px;background:white;padding:0 13px;font:inherit}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}.stat{background:white;border:1px solid var(--line);border-radius:16px;padding:14px}.stat span{font-size:10px;color:var(--muted);font-weight:850;text-transform:uppercase}.stat strong{display:block;font-size:25px;margin-top:5px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card,.modalbox{background:white;border:1px solid var(--line);border-radius:18px;padding:18px}.person{display:flex;gap:12px;align-items:center}.initials{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:#111;color:white;font-weight:900}.card h3{margin:0;font-size:17px}.muted{color:var(--muted);font-size:12px}.badges{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}.badge{border:1px solid var(--line);padding:5px 8px;border-radius:999px;font-size:10px;font-weight:850}.badge.active{border-color:#b8c8bc;background:#eef4ef}.badge.inactive{border-color:#c8d5e3;background:#edf2f7;color:var(--wine)}.actions{display:flex;gap:7px}.actions .btn{flex:1}.modal{position:fixed;inset:0;background:#0009;display:none;place-items:center;padding:18px;z-index:20}.modal.open{display:grid}.modalbox{width:min(760px,100%);max-height:92vh;overflow:auto}.modal-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.modal-title h2{font:700 27px Georgia,serif;margin:0}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form label{font-size:11px;font-weight:850}.form input,.form select,.form textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;margin-top:5px;font:inherit}.full{grid-column:1/-1}.check{display:flex;align-items:center;gap:7px}.check input{width:auto}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:17px}@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:620px){.wrap{padding:12px}.head{align-items:flex-start;flex-direction:column}.toolbar,.summary,.grid,.form{grid-template-columns:1fr}.full{grid-column:auto}}
</style><link rel="stylesheet" href="/css/care-theme.css?v=1"></head><body><main class="wrap"><section class="head"><div><div class="kicker">C.A.R.E EMPLOYEE CENTER</div><h1>Equipo</h1><p>Empleados, accesos, roles y formas de pago.</p></div><button class="btn primary" onclick="openForm()">Nuevo empleado</button></section><section class="toolbar"><input id="search" placeholder="Buscar por nombre, código o rol" oninput="render()"><select id="statusFilter" onchange="render()"><option value="all">Todos</option><option value="active">Activos</option><option value="inactive">Inactivos</option></select></section><section class="summary"><article class="stat"><span>Total</span><strong id="total">0</strong></article><article class="stat"><span>Activos</span><strong id="activeCount">0</strong></article><article class="stat"><span>Inactivos</span><strong id="inactiveCount">0</strong></article></section><section id="grid" class="grid"></section></main><div id="modal" class="modal"><form id="form" class="modalbox"><div class="modal-title"><h2 id="title">Nuevo empleado</h2><button class="btn" type="button" onclick="closeForm()">Cerrar</button></div><input type="hidden" id="id"><div class="form"><label>Nombre completo<input id="name" required></label><label>Código de acceso<input id="code" required></label><label>Rol<select id="role"><option>Cleaner</option><option>Inspector</option><option>Cleaner / Inspector</option><option>Dispatch / Inspector</option><option>Laundry / Activities / Runner</option><option>Manager</option><option>Admin</option></select></label><label>Tipo de pago<select id="payType"><option value="hourly">Por hora</option><option value="unit">Por unidad</option></select></label><label>Tarifa por hora<input id="hourlyRate" type="number" step=".01"></label><label>Tarifa por unidad<input id="unitRate" type="number" step=".01"></label><label>Teléfono<input id="phone"></label><label>Correo<input id="email" type="email"></label><label class="full">Ubicaciones<input id="locations" placeholder="Hotel, Chateau, Oficina"></label><label class="full">Notas<textarea id="notes"></textarea></label><label class="check"><input id="active" type="checkbox" checked> Empleado activo</label></div><div class="modal-actions"><button class="btn" type="button" onclick="closeForm()">Cancelar</button><button class="btn primary" type="submit">Guardar empleado</button></div></form></div><script>
let employees=[];const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function initials(n){return String(n||'?').split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase()}async function load(){const r=await fetch('/api/v2/employees?active=0&t='+Date.now()),d=await r.json();employees=d.employees||[];render()}function render(){const q=$('search').value.toLowerCase(),filter=$('statusFilter').value,rows=employees.filter(e=>(filter==='all'||(filter==='active')===!!e.active)&&(!q||`${e.name} ${e.code} ${e.role}`.toLowerCase().includes(q)));$('total').textContent=employees.length;$('activeCount').textContent=employees.filter(e=>e.active).length;$('inactiveCount').textContent=employees.filter(e=>!e.active).length;$('grid').innerHTML=rows.map(e=>`<article class="card"><div class="person"><div class="initials">${esc(initials(e.name))}</div><div><h3>${esc(e.name)}</h3><div class="muted">${esc(e.role||'Sin rol')}</div></div></div><div class="badges"><span class="badge">Código ${esc(e.code||'—')}</span><span class="badge ${e.active?'active':'inactive'}">${e.active?'Activo':'Inactivo'}</span><span class="badge">${e.payType==='unit'?'Por unidad':'Por hora'}</span></div><div class="actions"><button class="btn primary" onclick="edit(${e.id})">Editar</button><button class="btn" onclick="toggle(${e.id},${!e.active})">${e.active?'Desactivar':'Activar'}</button></div></article>`).join('')||'<article class="card">No hay empleados en este filtro.</article>'}function openForm(e={}){$('id').value=e.id||'';$('name').value=e.name||'';$('code').value=e.code||'';$('role').value=e.role||'Cleaner';$('payType').value=e.payType||'hourly';$('hourlyRate').value=e.hourlyRate||0;$('unitRate').value=e.unitRate||0;$('phone').value=e.phone||'';$('email').value=e.email||'';$('locations').value=(e.workLocations||[]).join(', ');$('notes').value=e.notes||'';$('active').checked=e.active!==false;$('title').textContent=e.id?'Editar empleado':'Nuevo empleado';$('modal').classList.add('open')}function closeForm(){$('modal').classList.remove('open')}function edit(id){openForm(employees.find(x=>Number(x.id)===Number(id)))}async function toggle(id,active){await fetch('/api/v2/employees/'+id+'/status',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({active})});load()}$('form').onsubmit=async ev=>{ev.preventDefault();const id=$('id').value,body={name:$('name').value,code:$('code').value,role:$('role').value,payType:$('payType').value,hourlyRate:$('hourlyRate').value,unitRate:$('unitRate').value,phone:$('phone').value,email:$('email').value,workLocations:$('locations').value.split(',').map(x=>x.trim()).filter(Boolean),notes:$('notes').value,active:$('active').checked};const r=await fetch(id?'/api/v2/employees/'+id:'/api/v2/employees',{method:id?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),d=await r.json();if(!r.ok)return alert(d.message||'No se pudo guardar');closeForm();load()};load();
</script><script src="/js/care-theme.js?v=1"></script></body></html>
